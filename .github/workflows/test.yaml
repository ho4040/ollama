name: test

concurrency:
  # For PRs, later CI runs preempt previous ones. e.g. a force push on a PR
  # cancels running CI jobs and starts all new ones.
  #
  # For non-PR pushes, concurrency.group needs to be unique for every distinct
  # CI run we want to have happen. Use run_id, which in practice means all
  # non-PR CI runs will be allowed to run without preempting each other.
  group: ${{ github.workflow }}-$${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**/*'
      - '!docs/**'
      - '!README.md'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      vendorsha: ${{ steps.changes.outputs.vendorsha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          changed() {
            local BASE=${{ github.event.pull_request.base.sha }}
            local HEAD=${{ github.event.pull_request.head.sha }}
            local MERGE_BASE=$(git merge-base $BASE $HEAD)
            git diff-tree -r --no-commit-id --name-only "$MERGE_BASE" "$HEAD" \
              | xargs python3 -c "import sys; from pathlib import Path; print(any(Path(x).match(glob) for x in sys.argv[1:] for glob in '$*'.split(' ')))"
          }

          echo changed=$(changed 'llama/llama.cpp/**/*' 'ml/backend/ggml/ggml/**/*' '.github/**/*') | tee -a $GITHUB_OUTPUT
          echo vendorsha=$(make -f Makefile.sync print-base) | tee -a $GITHUB_OUTPUT

  # TEMPORARY: Windows MLX build tuning experiment.  Mirrors release.yaml's
  # windows-depends MLX entry (full 11-virtual-arch CUDA list, real CUDA +
  # cuDNN install) so wall-time numbers here translate to release.  Vary
  # `nvcc-threads` and `build-jobs` in the matrix to iterate.
  #
  # All other test jobs (linux, generic windows, go_mod_tidy, test, patches)
  # are intentionally omitted on this branch.  Revert this whole file before
  # merging to main.
  windows-mlx-timing:
    needs: [changes]
    if: needs.changes.outputs.changed == 'True'
    environment: release
    strategy:
      matrix:
        include:
          - preset: 'MLX CUDA 13'
            install: https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_windows.exe
            cudnn-install: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.18.1.3_cuda13-archive.zip
            cuda-components:
              - '"cudart"'
              - '"nvcc"'
              - '"cublas"'
              - '"cublas_dev"'
              - '"cufft"'
              - '"cufft_dev"'
              - '"nvrtc"'
              - '"nvrtc_dev"'
              - '"crt"'
              - '"nvvm"'
              - '"nvptxcompiler"'
            cuda-version: '13.0'
            # Tuning knobs.  Edit and force-push to iterate.
            # Starting from the known-good Linux config (-j 16 -t 6) since
            # the Windows runner is also a large box.
            nvcc-threads: 6
            build-jobs: 16
    runs-on: windows
    steps:
      - name: Install system dependencies
        run: |
          choco install -y --no-progress ccache ninja
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache -o cache_dir=${{ github.workspace }}\.ccache
          }
      - id: cache-install
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
            C:\Program Files\NVIDIA\CUDNN
          key: ${{ matrix.install }}-${{ matrix.cudnn-install }}
      - name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.install }}" -OutFile "install.exe"
            $subpackages = @(${{ join(matrix.cuda-components, ', ') }}) | Foreach-Object {"${_}_${{ matrix.cuda-version }}"}
            Start-Process -FilePath .\install.exe -ArgumentList (@("-s") + $subpackages) -NoNewWindow -Wait
          }

          $cudaPath = (Resolve-Path "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\*").path
          echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install cuDNN for MLX
        run: |
          $ErrorActionPreference = "Stop"
          $cudnnRoot = "C:\Program Files\NVIDIA\CUDNN"
          if ("${{ steps.cache-install.outputs.cache-hit }}" -ne 'true') {
            Invoke-WebRequest -Uri "${{ matrix.cudnn-install }}" -OutFile "cudnn.zip"
            Expand-Archive -Path cudnn.zip -DestinationPath cudnn-extracted
            $cudnnDir = (Get-ChildItem -Path cudnn-extracted -Directory)[0].FullName
            New-Item -ItemType Directory -Force -Path $cudnnRoot
            Copy-Item -Path "$cudnnDir\*" -Destination "$cudnnRoot\" -Recurse
          }

          echo "CUDNN_ROOT_DIR=$cudnnRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDNN_INCLUDE_PATH=$cudnnRoot\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDNN_LIBRARY_PATH=$cudnnRoot\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$cudnnRoot\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: ${{ !cancelled() && steps.cache-install.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
            C:\Program Files\NVIDIA\CUDNN
          key: ${{ matrix.install }}-${{ matrix.cudnn-install }}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-windows-mlx-pr${{ github.event.pull_request.number }}-${{ needs.changes.outputs.vendorsha }}
          restore-keys: |
            ccache-windows-mlx-pr${{ github.event.pull_request.number }}-
            ccache-windows-mlx-
      - name: Runner system info
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-Table -AutoSize
          Get-CimInstance Win32_OperatingSystem | Select-Object @{N='TotalRAM_GB';E={[Math]::Round($_.TotalVisibleMemorySize/1MB, 2)}}, @{N='FreeRAM_GB';E={[Math]::Round($_.FreePhysicalMemory/1MB, 2)}} | Format-Table -AutoSize
          Get-PSDrive C | Select-Object Used, Free | Format-Table -AutoSize
          Write-Host "Tuning: nvcc-threads=${{ matrix.nvcc-threads }} build-jobs=${{ matrix.build-jobs }}"
      - name: Build MLX (timed) - nvcc-threads=${{ matrix.nvcc-threads }} build-jobs=${{ matrix.build-jobs }}
        run: |
          Import-Module 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Enter-VsDevShell -VsInstallPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -no_logo'

          $start = Get-Date
          cmake --preset "${{ matrix.preset }}" `
              -DCMAKE_CUDA_FLAGS="-t ${{ matrix.nvcc-threads }}" `
              --install-prefix "$((pwd).Path)\dist\windows-amd64"
          if ($LASTEXITCODE -ne 0) { exit($LASTEXITCODE) }
          $configEnd = Get-Date

          cmake --build --preset "${{ matrix.preset }}" -- -j ${{ matrix.build-jobs }}
          if ($LASTEXITCODE -ne 0) { exit($LASTEXITCODE) }
          $buildEnd = Get-Date

          cmake --install build\mlx_cuda_v13 --component MLX --strip
          if ($LASTEXITCODE -ne 0) { exit($LASTEXITCODE) }
          $installEnd = Get-Date

          Write-Host ""
          Write-Host "===== TIMING SUMMARY ====="
          Write-Host ("Configure: {0:F1}s" -f ($configEnd - $start).TotalSeconds)
          Write-Host ("Build:     {0:F1}s ({1:F1}m)" -f ($buildEnd - $configEnd).TotalSeconds, ($buildEnd - $configEnd).TotalMinutes)
          Write-Host ("Install:   {0:F1}s" -f ($installEnd - $buildEnd).TotalSeconds)
          Write-Host ("Total:     {0:F1}s ({1:F1}m)" -f ($installEnd - $start).TotalSeconds, ($installEnd - $start).TotalMinutes)
          Write-Host "Tuning:    nvcc-threads=${{ matrix.nvcc-threads }} build-jobs=${{ matrix.build-jobs }}"
        env:
          CMAKE_GENERATOR: Ninja
      - name: ccache stats
        if: always()
        run: |
          ccache -s
